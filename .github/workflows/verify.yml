name: Verify AIWF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-workflow
      - uses: actions/checkout@v4
        with: { repository: dharmax/block-patcher, path: block-patcher }
      - uses: actions/checkout@v4
        with: { repository: dharmax/codebase-parser, path: codebase-parser }
      - uses: actions/checkout@v4
        with: { repository: dharmax/context-manager, path: context-manager }
      - uses: actions/checkout@v4
        with: { repository: dharmax/llm-utils, path: llm-utils }
      - uses: actions/checkout@v4
        with: { repository: dharmax/pubsub, path: pubsub }
      - uses: actions/checkout@v4
        with: { repository: dharmax/semantika, path: semantika }
      - uses: actions/checkout@v4
        with: { repository: dharmax/shell-proc-utils, path: shell-proc-utils }
      - uses: actions/checkout@v4
        with: { repository: dharmax/shell-ui, path: shell-ui }
      - uses: actions/checkout@v4
        with: { repository: dharmax/text-compiler, path: text-compiler }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace
        run: |
          set -euo pipefail
          for dir in block-patcher codebase-parser context-manager llm-utils pubsub semantika shell-proc-utils shell-ui text-compiler ai-workflow; do
            (cd "$dir" && bun install --no-save)
          done

      - name: Verify AIWF
        working-directory: ai-workflow
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run pack
