name: ai-workflow audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  workflow-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: tsx scripts/ai-workflow/workflow-audit.ts
